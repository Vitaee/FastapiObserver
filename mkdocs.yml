site_name: fastapi-observer
site_description: Zero-glue FastAPI observability with security presets and runtime controls
site_url: https://vitaee.github.io/FastapiObserver/
repo_url: https://github.com/Vitaee/FastapiObserver
repo_name: Vitaee/FastapiObserver
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  # docs/index.md includes README.md, so the home page has one source.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Guides:
      - Configuration: configuration.md
      - Structured Logging: logging.md
      - Security & Presets: security.md
      - OpenTelemetry: opentelemetry.md
      - Runtime Control: runtime-control.md
  - Integrations:
      - Servers (uvicorn, gunicorn, Granian): servers.md
      - Backends: backends.md
      - Sentry: sentry.md
      - Database Tracing: db-tracing.md
      - GraphQL: graphql.md
      - Loguru: loguru.md
      - Logtail Sink: logtail-sink.md
      - Audit Logging: audit-logging.md
      - Plugins: plugins.md
  - Operations:
      - Architecture: architecture.md
      - Production Deployment: deployment.md
      - Kubernetes: kubernetes.md
      - Performance Tuning: tuning.md
      - Advanced Operations: advanced.md
      - Benchmarks: benchmarks.md
  - Design decisions:
      - Overview: decisions/index.md
      - 0001 Pure ASGI middleware: decisions/0001-pure-asgi-middleware.md
      - 0002 Logs leave through a queue: decisions/0002-logs-leave-through-a-queue.md
      - 0003 Trust only known peers: decisions/0003-trust-only-known-peers.md
      - 0004 Redact before anything leaves: decisions/0004-redact-before-anything-leaves.md
      - 0005 Route templates as labels: decisions/0005-route-templates-as-metric-labels.md
      - 0006 Delegate to OpenTelemetry: decisions/0006-delegate-to-opentelemetry.md
      - 0007 Opt-in destinations and controls: decisions/0007-new-destinations-are-opt-in.md
      - 0008 One state object per request: decisions/0008-one-state-object-per-request.md
      - 0009 Sample logs by trace ID: decisions/0009-sample-logs-per-request-by-trace-id.md
      - "Postmortem: unredacted OTLP logs": postmortems/2026-10-otlp-logs-exported-unredacted.md
  - Contributing: contributing.md
