site_name: fastapi-observer
site_description: Zero-glue FastAPI observability with security presets and runtime controls
site_url: https://vitaee.github.io/FastapiObserver/
repo_url: https://github.com/Vitaee/FastapiObserver
repo_name: Vitaee/FastapiObserver
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Guides:
      - Configuration: configuration.md
      - Structured Logging: logging.md
      - Security & Presets: security.md
      - OpenTelemetry: opentelemetry.md
      - Runtime Control: runtime-control.md
  - Integrations:
      - Servers (uvicorn, gunicorn, Granian): servers.md
      - Backends: backends.md
      - Sentry: sentry.md
      - Database Tracing: db-tracing.md
      - GraphQL: graphql.md
      - Loguru: loguru.md
      - Logtail Sink: logtail-sink.md
      - Audit Logging: audit-logging.md
      - Plugins: plugins.md
  - Operations:
      - Architecture: architecture.md
      - Production Deployment: deployment.md
      - Kubernetes: kubernetes.md
      - Performance Tuning: tuning.md
      - Advanced Operations: advanced.md
      - Benchmarks: benchmarks.md
  - Contributing: contributing.md
