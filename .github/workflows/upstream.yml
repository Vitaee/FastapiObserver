name: Upstream

# Runs the checks against the newest OpenTelemetry and prometheus_client
# releases, pre-releases included. The library relies on some of their
# internals (the OTel logs SDK is still private), so a breaking change should
# fail here before users upgrade into it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  newest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package, then upgrade OpenTelemetry and prometheus_client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,prometheus,otel,otel-httpx,otel-requests,otel-sqlalchemy]"
          python -m pip install --upgrade --pre \
            opentelemetry-api \
            opentelemetry-sdk \
            opentelemetry-exporter-otlp \
            opentelemetry-instrumentation-fastapi \
            opentelemetry-instrumentation-logging \
            opentelemetry-instrumentation-httpx \
            opentelemetry-instrumentation-requests \
            opentelemetry-instrumentation-sqlalchemy \
            prometheus-client
          python -m pip list | grep -iE "^(opentelemetry|prometheus)"

      - name: Pytest
        run: python -m pytest -q

      - name: Mypy
        run: mypy src
