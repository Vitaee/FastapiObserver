name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # The oldest Python also gets the oldest versions pyproject.toml allows.
          - python-version: "3.11"
            resolution: lowest-direct
          # Log lines are encoded by orjson when it's installed, by json otherwise.
          - python-version: "3.14"
            extras: ",fast-json"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution "${{ matrix.resolution || 'highest' }}" \
            -e ".[dev,prometheus,otel${{ matrix.extras }}]"

      - name: Pytest
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,prometheus,otel]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Dependency audit
        run: pip-audit

  package:
    # The same build as a release, so a packaging mistake fails here first.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-test/bin/python -c \
            "import fastapiobserver; print(fastapiobserver.__version__)"
