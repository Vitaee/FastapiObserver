name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release; select that tag as the workflow ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      baseline: ${{ steps.resolve.outputs.baseline }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require the requested tag to identify this exact commit
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python scripts/release_ref.py --tag "$REQUESTED_TAG" --expected-commit "$EXPECTED_COMMIT" > release.json
          python - <<'PY'
          import json, os, subprocess
          metadata = json.load(open("release.json"))
          metadata["baseline"] = subprocess.check_output(
              ["git", "describe", "--tags", "--match", "v[0-9]*", "--abbrev=0", metadata["commit"] + "^"],
              text=True,
          ).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in metadata.items():
                  output.write(f"{key}={value}\n")
          PY

  validation:
    needs: identity
    uses: ./.github/workflows/validation.yml
    with:
      source-ref: ${{ needs.identity.outputs.commit }}
      baseline-ref: ${{ needs.identity.outputs.baseline }}

  publish:
    needs: [identity, validation]
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-${{ needs.identity.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validation.outputs.distribution-id }}
          path: dist
      - name: Verify artifact identity and prepare release notes
        id: files
        env:
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          test "$(cat dist/COMMIT)" = "$RELEASE_COMMIT"
          (cd dist && sha256sum -c SHA256SUMS)
          python scripts/release_ref.py --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --distributions dist/packages --upload-directory dist/upload > publication.json
          python -c 'import json; print("upload-required=" + json.load(open("publication.json"))["upload_required"])' >> "$GITHUB_OUTPUT"
          python scripts/extract_changelog_section.py "$RELEASE_VERSION" > RELEASE_NOTES.md
      - name: Publish the validated files without rebuilding
        if: steps.files.outputs.upload-required == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/upload/
          attestations: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.identity.outputs.tag }}
          name: ${{ needs.identity.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.identity.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.identity.outputs.prerelease != 'true' }}
