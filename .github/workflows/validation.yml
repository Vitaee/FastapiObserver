name: Shared production validation

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      baseline-ref:
        required: true
        type: string
    outputs:
      distribution-id:
        value: ${{ jobs.package.outputs.distribution-id }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      distribution-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the distributions once
        run: |
          python -m pip install build twine
          python -m build --outdir dist/packages
          python -m twine check dist/packages/*
          git rev-parse HEAD > dist/COMMIT
          cd dist && sha256sum packages/* > SHA256SUMS
      - name: Check the FastAPI wheel with required dependencies
        run: |
          python -m venv /tmp/core-wheel
          /tmp/core-wheel/bin/pip install dist/packages/*.whl
          cd /tmp
          /tmp/core-wheel/bin/python -c 'from fastapi import FastAPI; from fastapiobserver import install_observability; install_observability(FastAPI(), metrics_enabled=False)'
      - name: Check experimental separation without frameworks or exporters
        run: |
          python -m venv /tmp/operation-wheel
          /tmp/operation-wheel/bin/pip install --no-deps dist/packages/*.whl
          /tmp/operation-wheel/bin/pip install 'pydantic-settings>=2.10.1'
          cd /tmp
          /tmp/operation-wheel/bin/python - <<'PY'
          import importlib.util, io, json, logging, threading
          for name in ('fastapi', 'starlette', 'sqlalchemy', 'opentelemetry'):
              assert importlib.util.find_spec(name) is None
          threads = set(threading.enumerate())
          from fastapiobserver import ObservabilitySettings, StructuredJsonFormatter
          from fastapiobserver.experimental import observe_operation
          output = io.StringIO()
          handler = logging.StreamHandler(output)
          handler.setFormatter(StructuredJsonFormatter(ObservabilitySettings()))
          logger = logging.getLogger('separation-check')
          logger.setLevel(logging.INFO)
          logger.addHandler(handler)
          with observe_operation('plain.python', logger=logger) as operation:
              assert operation.record_call('db', 0.001)
              call = operation.start_call('http')
              assert call.finish() and not call.finish()
          event = json.loads(output.getvalue())['event']
          assert event['outcome'] == 'success'
          assert event['db']['count'] == event['http']['count'] == 1
          assert threads == set(threading.enumerate())
          PY
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  tests:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
          - python: "3.11"
            resolution: lowest-direct
          - python: "3.12"
          - python: "3.13"
          - python: "3.14"
          - python: "3.14"
            extra: ",fast-json"
          - python: "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.distribution-id }}
          path: dist
      - name: Install the wheel and selected dependencies
        env:
          RESOLUTION: ${{ matrix.resolution || 'highest' }}
          EXTRAS: dev,prometheus,otel,otel-httpx,otel-requests,otel-sqlalchemy${{ matrix.extra }}
        run: |
          python -m pip install uv
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          extras = os.environ['EXTRAS']
          requirements = list(project['dependencies'])
          for extra in extras.split(','):
              requirements.extend(project['optional-dependencies'][extra])
          wheel = next(pathlib.Path('dist/packages').glob('*.whl'))
          # The wheel alone makes its dependencies transitive to uv. Supply
          # their requirements directly so lowest-direct tests the actual floors.
          subprocess.run(['uv', 'pip', 'install', '--system', '--resolution',
                          os.environ['RESOLUTION'], f'{wheel}[{extras}]', *requirements],
                         check=True)
          PY
      - name: Test installed package, including real server failure budgets
        run: python -m pytest -q --cov -o pythonpath=

  quality:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.distribution-id }}
          path: dist
      - name: Quality and dependency audit
        run: |
          wheels=(dist/packages/*.whl)
          python -m pip install "${wheels[0]}[dev,all]"
          ruff check .
          mypy src
          pip-audit

  production:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.distribution-id }}
          path: dist
      - name: Install validation dependencies
        run: |
          wheels=(dist/packages/*.whl)
          python -m pip install "${wheels[0]}[dev,prometheus,otel,otel-httpx,otel-requests,otel-sqlalchemy]"
      - name: Test the wheel outside the checkout
        run: |
          mkdir -p /tmp/installed-check
          cp -R tests /tmp/installed-check/tests
          cp -R spec /tmp/installed-check/spec
          mkdir -p /tmp/installed-check/scripts /tmp/installed-check/examples
          cp scripts/compatibility_probe.py /tmp/installed-check/scripts/
          cp examples/python_operation.py /tmp/installed-check/examples/
          cp examples/callback_operation.py /tmp/installed-check/examples/
          cp examples/query_budget.py /tmp/installed-check/examples/
          cd /tmp/installed-check
          python -m pytest -q tests/test_sqlalchemy_integration.py tests/test_otel_integration.py tests/test_metrics_contracts.py tests/test_application_logging.py tests/test_release_compatibility.py tests/test_experimental_operations.py tests/test_core_imports.py tests/test_call_recording.py tests/test_call_ownership.py tests/test_operation_contract.py tests/test_route_template_cardinality.py tests/test_sql_execution_details.py tests/test_observation_metadata.py tests/test_redaction_properties.py tests/test_query_budget.py
      - name: Standard runtime stress gate
        run: python scripts/runtime_stress.py --profile standard --json > runtime-stress.log
      - name: Paired CPU overhead gate
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
        run: python scripts/compare_overhead.py --baseline "$BASELINE_REF" --output overhead.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-evidence
          path: |
            runtime-stress.log
            overhead.json
          if-no-files-found: error

  backends:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tracing: ["true", "false"]
    env:
      COMPOSE_PROJECT_NAME: observer-validation
      COMPOSE_FILE: examples/full_stack/docker-compose.yml:examples/full_stack/ci.yml
      OBS_OTEL_ENABLED: ${{ matrix.tracing }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.distribution-id }}
          path: dist
      - name: Start pinned backends with the built wheel
        run: docker compose up -d --build --wait --wait-timeout 180 app-a app-b app-c prometheus
      - name: Verify exported logs, metrics and traces
        run: |
          if [ "$OBS_OTEL_ENABLED" = false ]; then
            python examples/full_stack/verify.py --no-tracing
          else
            python examples/full_stack/verify.py
          fi
      - name: Preserve backend diagnostics
        if: always()
        run: docker compose logs --no-color > backend.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backends-tracing-${{ matrix.tracing }}
          path: backend.log
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
