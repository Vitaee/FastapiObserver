[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-observer"
dynamic = ["version"]
description = "Zero-glue FastAPI observability with security presets and runtime controls"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vitaee", email = "opensource@vitaee.dev" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = ["fastapi", "observability", "logging", "metrics", "opentelemetry"]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.133.0",
    "pydantic-settings>=2.10.1",
    "starlette>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/Vitaee/FastapiObserver"
Documentation = "https://vitaee.github.io/FastapiObserver/"
Repository = "https://github.com/Vitaee/FastapiObserver.git"
Issues = "https://github.com/Vitaee/FastapiObserver/issues"
Funding = "https://buymeacoffee.com/FYbPCSu"

[project.optional-dependencies]
fast-json = [
    "orjson>=3.11.7",
]
prometheus = [
    "prometheus-client>=0.24.1",
]
loguru = [
    "loguru>=0.7.2",
]
otel = [
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
]
otel-httpx = [
    "opentelemetry-instrumentation-httpx>=0.66b1",
]
otel-requests = [
    "opentelemetry-instrumentation-requests>=0.66b1",
]
audit = [
    "cryptography>=50.0.0",
]
otel-sqlalchemy = [
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]
all = [
    "orjson>=3.11.7",
    "prometheus-client>=0.24.1",
    "loguru>=0.7.2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "cryptography>=50.0.0",
]
dev = [
    "httpx2>=2.16.0",
    "loguru>=0.7.3",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.3",
    "cyclonedx-bom>=7.6.0",
    "uvicorn>=0.54.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "fastapiobserver._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["orjson", "orjson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
